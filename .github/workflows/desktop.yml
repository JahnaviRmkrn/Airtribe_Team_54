name: Desktop & Android builds

# Builds the Electron installers (macOS .dmg/.zip, Windows NSIS/portable,
# Linux AppImage) and the Android debug APK. Run manually, or by pushing a
# tag like desktop-v0.1.0. Artifacts land under the run's Artifacts section.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Universal binary: one dmg/zip runs on Intel and Apple Silicon.
            args: --mac dmg zip --universal
            artifact: macos
          - os: windows-latest
            args: --win nsis portable
            artifact: windows
          - os: ubuntu-latest
            args: --linux AppImage
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build (${{ matrix.artifact }})
        run: npx electron-builder ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: muop-${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The action's default package set includes the removed legacy
          # 'tools' package; name only what the build needs.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: npm ci
      - name: Generate the Android Gradle project files
        run: npx cap sync android
      - name: Point Gradle at the CI Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: muop-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Signed release APK, only when the keystore secrets exist (mobile/README.md).
      - name: Check for release keystore secret
        id: ks
        run: echo "present=${{ secrets.MUOP_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"
      - name: Restore release keystore
        if: steps.ks.outputs.present == 'true'
        run: echo "$MUOP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/muop-release.jks"
        env:
          MUOP_KEYSTORE_BASE64: ${{ secrets.MUOP_KEYSTORE_BASE64 }}
      - name: Build signed release APK
        if: steps.ks.outputs.present == 'true'
        working-directory: mobile/android
        run: ./gradlew assembleRelease
        env:
          MUOP_KEYSTORE_FILE: ${{ runner.temp }}/muop-release.jks
          MUOP_KEYSTORE_PASSWORD: ${{ secrets.MUOP_KEYSTORE_PASSWORD }}
          MUOP_KEY_ALIAS: ${{ secrets.MUOP_KEY_ALIAS }}
          MUOP_KEY_PASSWORD: ${{ secrets.MUOP_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.present == 'true'
        with:
          name: muop-android-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
